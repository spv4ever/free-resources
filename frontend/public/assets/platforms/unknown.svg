<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#444"></stop>
      <stop offset="100%" stop-color="#222"></stop>
    </linearGradient>
  </defs>

  <!-- Fondo con borde redondeado -->
  <rect width="64" height="64" rx="12" ry="12" fill="url(#grad)"></rect>

  <!-- Icono de TV más grande -->
  <g fill="#ccc">
    <rect x="10" y="12" width="44" height="30" rx="3" ry="3" stroke="#ccc" stroke-width="2" fill="none"></rect>
    <rect x="22" y="44" width="20" height="4" fill="#ccc"></rect>
  </g>

  <!-- Texto claro y bien centrado -->
  <text x="32" y="58" font-size="11" fill="#ccc" font-family="Arial, sans-serif" text-anchor="middle">
    Streaming
  </text>
</svg>
