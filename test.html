<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Imagen Promocional KeikoPrompts</title>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;700&display=swap" rel="stylesheet">
  <style>
    body {
      width: 1080px;
      height: 1080px;
      margin: 0;
      font-family: 'Manrope', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      background-image: url('https://via.placeholder.com/1080'); /* Reemplaza con tu imagen IA */
      background-size: cover;
      background-position: center;
      position: relative;
      color: white;
      text-align: center;
    }
    .overlay {
      background-color: rgba(0, 0, 0, 0.65);
      padding: 40px;
      border-radius: 20px;
    }
    h1 {
      font-size: 48px;
      margin-bottom: 20px;
    }
    p {
      font-size: 24px;
      margin-bottom: 30px;
    }
    .cta {
      display: inline-block;
      background: white;
      color: black;
      padding: 12px 24px;
      font-weight: bold;
      border-radius: 10px;
      font-size: 20px;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <div class="overlay">
    <h1>¿Sabías que puedes generar esto<br>desde tu navegador?</h1>
    <p>KeikoPrompts te da 5 tokens gratis cada día</p>
    <a href="https://keikodev.es/keikoprompts" class="cta">👉 Visita keikodev.es/keikoprompts</a>
  </div>
</body>
</html>
